[microinsurance_nodes]
target-server-01 ansible_host=192.168.1.100 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[microinsurance_nodes:vars]
ansible_python_interpreter=/usr/bin/python3
app_port=8080
app_env=production
