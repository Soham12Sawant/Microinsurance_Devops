version: '3.8'

services:
  microinsurance-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: microinsurance-platform:1.0.0
    container_name: microinsurance-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8080
    networks:
      - microinsurance-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx-proxy:
    image: nginx:alpine
    container_name: microinsurance-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - microinsurance-app
    networks:
      - microinsurance-network

  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: microinsurance-jenkins
    restart: always
    privileged: true
    user: root
    ports:
      - "8089:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - microinsurance-network

networks:
  microinsurance-network:
    driver: bridge

volumes:
  jenkins_home:
    driver: local
