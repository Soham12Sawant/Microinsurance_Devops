# Microinsurance Enrollment Platform Configuration
server.port=8080
spring.application.name=microinsurance-enrollment-platform

# H2 In-Memory Database Configuration
spring.datasource.url=jdbc:h2:mem:microinsurancedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (for debugging and local inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Actuator Endpoints for Health Checks and DevOps Monitoring
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Microinsurance Business Rules Engine Settings
app.environment=development
app.insurance.max-eligible-annual-income=60000.0
app.insurance.min-age=18
app.insurance.max-age=65
app.insurance.auto-approval-threshold-coverage=5000.0
# Feature 1 Config: Enhanced Intake Rate Limiting
app.insurance.registration.rate-limit-per-min=60
app.underwriting.audit-timeout-hours=24 # Expedited SLA
